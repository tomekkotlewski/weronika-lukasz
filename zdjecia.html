<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weronika i Łukasz</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 1rem;
            background: #DBC7C7;
        }

        h1 {
            text-align: center;
            font-family: Arial, sans-serif;
            font-size: clamp(0.5rem,20vw,1rem);
            font-weight: normal;
            color: #FF0066;
        }
        h2 {
            text-align: center;
            font-family: 'Kunstler Script', cursive;
            font-size: clamp(1rem,20vw,7rem);
            font-weight: bold;
            color: #000000;
            line-height: 1.0
        }
        h3 {
            text-align: center;
            font-family: Times New Roman, sans-serif;
            font-size: clamp(1rem,20vw,2rem);
            font-weight: normal;
            color: #FF0066;
            line-height: 1.0
        }
        h4 {
            text-align: center;
            font-family: Times New Roman, sans-serif;
            font-size: clamp(1rem,20vw,2rem);
            font-weight: normal;
            color: #FF0066;
            line-height: 1.0
        }

        .upload-panel {
            background: #DBC7C7;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        button {
            padding: 10px 20px;
            background: #0366d6;
            color: white;
            border: none;
            border-radius: 0px;
            cursor: pointer;
        }

        button:hover {
            background: #024ea4;
        }

        .gallery {
            columns: 250px;
            column-gap: 15px;
        }

        .gallery img {
            width: 100%;
            margin-bottom: 15px;
            border-radius: 10px;
            display: block;
        }

        .gallery img:hover {
            transform: scale(1.03);
        }

        .lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .lightbox img {
            max-width: 95%;
            max-height: 95%;
            border-radius: 10px;
        }

        .close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 40px;
        cursor: pointer;
        }

        #imageInput {
            display: none;
        }

        .file-label {
            background: white;
            padding: 12px 24px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 1rem;
            box-shadow: 0 4px 10px rgba(0,0,0,.1);
            transition: .2s;
        }

        .file-label:hover {
            transform: translateY(-2px);
        }

        .file-name {
            font-size: 0.9rem;
            color: #666;
            margin-top: 10px;
        }

        .upload-btn {
            background: #FF0066;
            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 30px;
            font-size: 1rem;
            cursor: pointer;
            transition: .2s;
        }

        .upload-btn:hover {
            background: #e00059;
            transform: translateY(-2px);
        }

        .loader {
            display: none;
        width: 40px;
        height: 40px;
        border: 4px solid #ffd1e0;
        border-top: 4px solid #FF0066;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 10px auto;
        }

        @keyframes spin {
            100% {
            transform: rotate(360deg);
            }
        }
        
        
    </style>
</head>
<body>

<h1>28 SIERPNIA 2026</h1>
<h2>Weronika<br>
    &hearts;<br>
    Łukasz</h2>
<h3> &mdash; &hearts; &mdash;</h3>
<h4>Czekamy na Feeest ujęcia!!</h4>

<div class="upload-panel">

    <label for="imageInput" class="file-label">
        📸 Wybierz zdjęcie
    </label>

    <input
        type="file"
        id="imageInput"
        accept="image/*"
        capture="environment">

    <div id="fileName" class="file-name">
        Nie wybrano zdjęcia
    </div>

    <button class="upload-btn" onclick="uploadImage()">
        ⬆️ Wrzuć fotkę
    </button>
    <div id="loader" class="loader"></div>

</div>

<div id="gallery" class="gallery"></div>

<div id="lightbox" class="lightbox">
    <span class="close">&times;</span>
    <img id="lightboxImg">
</div>
    
<script>

    let touchStartX = 0;
    let touchEndX = 0;

    let galleryFiles = [];
    let currentIndex = 0;

    document
    .getElementById("imageInput")
    .addEventListener("change", function () {

        document.getElementById("fileName").textContent =
            this.files.length
                ? this.files[0].name
                : "Nie wybrano zdjęcia";
    });


async function loadGallery() {

    try {

        const response = await fetch(
            "https://weronika-upload.tomek-kotlewski.workers.dev/"
        );

        const files = await response.json();

        console.log(files);

        const gallery =
            document.getElementById("gallery");

        gallery.innerHTML = "";

        galleryFiles = files.filter(file =>
            file.download_url
        );
        
        galleryFiles.forEach((file, index) => {

            const img =
                document.createElement("img");

            img.src = file.download_url;
            
            img.alt = file.name;
            
            img.onclick = () => {

                currentIndex = index;

                document.getElementById(
                    "lightboxImg"
                ).src = file.download_url;

                document.getElementById(
                    "lightbox"
                ).style.display = "flex";
            };

            gallery.appendChild(img);

        });

    } catch (err) {
        loader.style.display = "none";
        console.error(err);
        alert("Błąd:\n" + err.message);
    }
}

    async function uploadImage() {

    const input = document.getElementById("imageInput");

    if (!input.files.length) {
        alert("Wybierz zdjęcie.");
        return;
    }

    const file = input.files[0];
        
    const loader = document.getElementById("loader");
    loader.style.display = "block";

    const reader = new FileReader();

    reader.onload = async function () {
        const base64Content =
            reader.result.split(",")[1];

        const fileName =
            `${Date.now()}_${file.name}`;


        try {

            const response = await fetch(
    "https://weronika-upload.tomek-kotlewski.workers.dev/",
    {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            fileName: fileName,
            content: base64Content
        })
    }
);


            const result = await response.json();

            if (!response.ok) {
                loader.style.display = "none";
                console.error(result);
                alert("Błąd wysyłania zdjęcia.");
                return;
            }

            await loadGallery();
            
            loader.style.display = "none";
            input.value = "";
            document.getElementById("fileName").textContent =
                "Nie wybrano zdjęcia";

            loadGallery();

        } catch (err) {
            loader.style.display = "none";
            console.error(err);
            alert("Błąd:\n" + err.message);
        }
    };

    reader.readAsDataURL(file);

    
}

loadGallery();

document.getElementById("fileName").textContent =
    "Nie wybrano zdjęcia";
    
console.log("Ładuję galerię...");


document.querySelector(".close")
    .onclick = () => {

    document.getElementById(
        "lightbox"
    ).style.display = "none";
};

const lightbox =
    document.getElementById("lightbox");

const lightboxImg =
    document.getElementById("lightboxImg");

const closeBtn =
    document.querySelector(".close");

closeBtn.onclick = () => {
    lightbox.style.display = "none";
};

lightbox.onclick = (e) => {

    if (e.target === lightbox) {
        lightbox.style.display = "none";
    }
};

function showImage(index) {

    if (index < 0) {
        index = galleryFiles.length - 1;
    }

    if (index >= galleryFiles.length) {
        index = 0;
    }

    currentIndex = index;

    document.getElementById(
        "lightboxImg"
    ).src = galleryFiles[index].download_url;
}

        lightboxImg.addEventListener(
        "touchstart",
        (e) => {
            touchStartX =
                e.changedTouches[0].screenX;
        },
        { passive: true }
    );

    lightboxImg.addEventListener(
        "touchend",
        (e) => {

            touchEndX =
                e.changedTouches[0].screenX;

            const diff =
                touchStartX - touchEndX;

            if (Math.abs(diff) < 50) {
                return;
            }
    
            if (diff > 0) {
                showImage(currentIndex + 1);
            } else {
                showImage(currentIndex - 1);
            }
        },
        { passive: true }
    );

</script>
</body>
</html>
