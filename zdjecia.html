<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weronika i Łukasz</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 1rem;
            background: #DBC7C7;
        }

        h1 {
            text-align: center;
            font-family: Arial, sans-serif;
            font-size: clamp(0.5rem,20vw,1rem);
            font-weight: normal;
            color: #FF0066;
        }
        h2 {
            text-align: center;
            font-family: 'Kunstler Script', cursive;
            font-size: clamp(1rem,20vw,7rem);
            font-weight: bold;
            color: #000000;
            line-height: 1.0
        }
        h3 {
            text-align: center;
            font-family: Times New Roman, sans-serif;
            font-size: clamp(1rem,20vw,2rem);
            font-weight: normal;
            color: #FF0066;
            line-height: 1.0
        }
        h4 {
            text-align: center;
            font-family: Times New Roman, sans-serif;
            font-size: clamp(1rem,20vw,2rem);
            font-weight: normal;
            color: #FF0066;
            line-height: 1.0
        }

        .upload-panel {
            background: #DBC7C7;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        button {
            padding: 10px 20px;
            background: #0366d6;
            color: white;
            border: none;
            border-radius: 0px;
            cursor: pointer;
        }

        button:hover {
            background: #024ea4;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
        }

        .gallery img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 10px;
            background: white;
            box-shadow: 0 2px 10px rgba(0,0,0,.1);
            transition: transform .3s;
        }

        .gallery img:hover {
            transform: scale(1.03);
        }
    </style>
</head>
<body>

<h1>28 SIERPNIA 2026</h1>
<h2>Weronika<br>
    &hearts;<br>
    Łukasz</h2>
<h3> &mdash; &hearts; &mdash;</h3>
<h4>Czekamy na Feeest ujęcia!!</h4>

<div class="upload-panel">

    <input
        type="file"
        id="imageInput"
        accept="image/*"
        capture="environment">

    <button onclick="uploadImage()">
        Wrzuć fotkę
    </button>

</div>

<div id="gallery" class="gallery"></div>

<script>

    const owner = "tomekkotlewski";
    const repo = "weronika-lukasz";
    const branch = "main";
    const folder = "galeria";

    const url =
      `https://api.github.com/repos/${owner}/${repo}/contents/${folder}/${data.fileName}`;

    const response = await fetch(url, {
      method: "PUT",
      headers: {
        Authorization: `Bearer ${env.GITHUB_TOKEN}`,
        Accept: "application/vnd.github+json",
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: `Dodano ${data.fileName}`,
        content: data.content,
        branch: branch
      })
    });

    const result = await response.json();

    return Response.json(result, {
      status: response.status
    });
  }
};

async function loadGallery() {

    try {

        const response = await fetch(
            "https://weronika-upload.tomek-kotlewski.workers.dev/"
        );

        const files = await response.json();

        console.log(files);

        const gallery =
            document.getElementById("gallery");

        gallery.innerHTML = "";

        files.forEach(file => {

            const img =
                document.createElement("img");

            img.src = file.download_url;

            gallery.appendChild(img);

        });

    } catch (err) {

        console.error(err);

    }
}

    async function uploadImage() {

    const input = document.getElementById("imageInput");

    if (!input.files.length) {
        alert("Wybierz zdjęcie.");
        return;
    }

    const file = input.files[0];

    const reader = new FileReader();

    reader.onload = async function () {

        const base64Content =
            reader.result.split(",")[1];

        const fileName =
            `${Date.now()}_${file.name}`;

        const url =
            `https://api.github.com/repos/${owner}/${repo}/contents/${folder}/${fileName}`;

        try {

            const response = await fetch(
    "https://weronika-upload.tomek-kotlewski.workers.dev/",
    {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            fileName: fileName,
            content: base64Content
        })
    }
);


            const result = await response.json();

            if (!response.ok) {
                console.error(result);
                alert("Błąd wysyłania zdjęcia.");
                return;
            }

            alert("Zdjęcie wysłane!");

            loadGallery();

        } catch (err) {

            console.error(err);

            alert(
                "Błąd:\n" + err.message
            );
        }
    };

    reader.readAsDataURL(file);
}

loadGallery();
console.log("Ładuję galerię...");


</script>
</body>
</html>
