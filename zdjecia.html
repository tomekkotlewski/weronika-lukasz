<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weronika i Łukasz</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 1rem;
            background: #F3E4D1
        }

        h1 {
            text-align: center;
            font-family: Times New Roman, sans-serif;
            font-size: clamp(0.5rem,20vw,1rem);
            font-weight: normal;
            color: #CBA769;
        }
        h2 {
            text-align: center;
            font-family: 'Kunstler Script', cursive;
            font-size: clamp(1rem,20vw,6rem);
            font-weight: bold;
            color: #B4945D;
            line-height: 1.0;
            margin-top: 5px;
            margin-bottom: 5px
        }
        h3 {
            text-align: center;
            font-family: Times New Roman, sans-serif;
            font-size: clamp(1rem,20vw,6rem);
            font-weight: bold;
            color: #B4945D;
            line-height: 1.0;
            margin-top: 5px;
            margin-bottom: 5px
        }
        h4 {
            text-align: center;
            font-family: 'Kunstler Script', cursive;
            font-size: clamp(1rem,20vw,6rem);
            font-weight: bold;
            color: #B4945D;
            line-height: 1.0;
            margin-top: 5px;
            margin-bottom: 5px
        }
        h5 {
            text-align: center;
            font-family: Times New Roman, sans-serif;
            font-size: clamp(1rem,20vw,2rem);
            font-weight: normal;
            color: #CBA769;
            line-height: 1.0;
            margin-top: 5px;
            margin-bottom: 7px
        }

        .upload-panel {
            background: #F3E4D1;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        button {
            padding: 10px 20px;
            background: #0366d6;
            color: white;
            border: none;
            border-radius: 0px;
            cursor: pointer;
        }

        button:hover {
            background: #024ea4;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(
                auto-fill,
                minmax(100px,1fr)
            );
            gap: 15px;
        }

        .gallery img {
            width: 100%;
            margin-bottom: 15px;
            border-radius: 10px;
            display: block;
        }

        .gallery img:hover {
            transform: scale(1.03);
        }

        .lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .lightbox img {
            max-width: 95%;
            max-height: 95%;
            border-radius: 10px;
        }

        .close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 40px;
        cursor: pointer;
        }

        #imageInput {
            display: none;
        }

        .file-label {
            background: white;
            padding: 12px 24px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 1rem;
            box-shadow: 0 4px 10px rgba(0,0,0,.1);
            transition: .2s;
        }

        .file-label:hover {
            transform: translateY(-2px);
        }

        .file-name {
            font-size: 0.9rem;
            color: #666;
            margin-top: 10px;
        }

        .upload-btn {
            background: #FF0066;
            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 30px;
            font-size: 1rem;
            cursor: pointer;
            transition: .2s;
        }

        .upload-btn:hover {
            background: #e00059;
            transform: translateY(-2px);
        }

        .loader {
            display: none;
            width: 40px;
            height: 40px;
            border: 4px solid #ffd1e0;
            border-top: 4px solid #FF0066;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 10px auto;
        }

        @keyframes spin {
            100% {
            transform: rotate(360deg);
            }
        }
        
        .hero {
            width: 100%;
            height: 40vh;
            background-image: url("https://raw.githubusercontent.com/tomekkotlewski/weronika-lukasz/main/Tlo.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            border-radius: 15px;
            margin-top: 5px;
            margin-bottom: 5px;
            
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 20px;

            -webkit-mask-image:
                linear-gradient(to right,
                    tranmsparent 0%;
                    black 8%,
                    black 92%,
                    transparent 100%
                ),
                linear-gradient(to bottom,
                    transparent 0%,
                    black 8%,
                    black 92%,
                    transparent 100%
                );
            -webkit-mask-composite: source-in;
        }




            
        }

        .hero-text {
            text-align: center;
            color: white;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.7);
        }

        .nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: white;
            font-size: 60px;
            font-weight: bold;
            cursor: pointer;
            padding: 15px;
            user-select: none;
            z-index: 10000;
        }

        .prev {
            left: 20px;
        }    

        .next {
            right: 20px;
        }

        .nav:hover {
            color: #FF0066;
        }


        
    </style>
</head>
<body>


<h1>28 SIERPNIA 2026</h1>
<h2>Weronika</h2>
<h3>&hearts;</h3>
<h4>Łukasz</h4>

<div class="hero"></div>
    
<h5> &mdash; &hearts; &mdash;</h5>

<div class="upload-panel">

    <label for="imageInput" class="file-label">
        📸 Zrób fotkę
    </label>

    <input
        type="file"
        id="imageInput"
        accept="image/*"
        capture="environment">

    <div id="loader" class="loader"></div>

</div>

<div id="gallery" class="gallery"></div>

<div id="lightbox" class="lightbox">
    <span class="close">&times;</span>

    <span class="nav prev">&#10094;</span>

    <img id="lightboxImg">

    <span class="nav next">&#10095;</span>
</div>
    
<script>

    let galleryFiles = [];
    let currentIndex = 0;

    document
    .getElementById("imageInput")
    .addEventListener("change", function () {
        if (this.files.length) {
            uploadImage();
        }
    });


async function loadGallery() {

    try {

        const response = await fetch(
            "https://weronika-upload.tomek-kotlewski.workers.dev/"
        );

        const files = await response.json();

        console.log(files);

        const gallery =
            document.getElementById("gallery");

        gallery.innerHTML = "";

        galleryFiles = files
            .filter(file => file.download_url)
            .sort((a, b) => {
                const timeA = parseInt(a.name.split("_")[0]);
                const timeB = parseInt(b.name.split("_")[0]);
                return timeB - timeA; // najnowsze na górze
            });
        
        galleryFiles.forEach((file, index) => {

            const img =
                document.createElement("img");

            img.loading = "lazy";
            img.decoding = "async";

            img.src = file.download_url;
            img.alt = file.name;
            
            img.onclick = () => {

                currentIndex = index;

                document.getElementById(
                    "lightboxImg"
                ).src = file.download_url;

                document.getElementById(
                    "lightbox"
                ).style.display = "flex";
            };

            gallery.appendChild(img);

        });

    } catch (err) {
        document.getElementById("loader").style.display = "none";
        console.error(err);
        alert("Błąd:\n" + err.message);
    }
}

    async function uploadImage() {

    const input = document.getElementById("imageInput");

    if (!input.files.length) {
        alert("Zrób zdjęcie!");
        return;
    }

    const file = input.files[0];

    const loader = document.getElementById("loader");
    loader.style.display = "block";

    const reader = new FileReader();

    reader.onload = function (e) {

        const img = new Image();

        img.onload = async function () {

            try {

                const canvas = document.createElement("canvas");
                const ctx = canvas.getContext("2d");

                const MAX_SIZE = 1600;

                let width = img.width;
                let height = img.height;

                if (width > height) {

                    if (width > MAX_SIZE) {
                        height = height * (MAX_SIZE / width);
                        width = MAX_SIZE;
                    }

                } else {

                    if (height > MAX_SIZE) {
                        width = width * (MAX_SIZE / height);
                        height = MAX_SIZE;
                    }

                }

                canvas.width = width;
                canvas.height = height;

                ctx.drawImage(
                    img,
                    0,
                    0,
                    width,
                    height
                );

                const compressedDataUrl =
                    canvas.toDataURL(
                        "image/jpeg",
                        0.75
                    );

                const base64Content =
                    compressedDataUrl.split(",")[1];

                const fileName =
                    `${Date.now()}.jpg`;

                const response = await fetch(
                    "https://weronika-upload.tomek-kotlewski.workers.dev/",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            fileName: fileName,
                            content: base64Content
                        })
                    }
                );

                const result = await response.json();

                if (!response.ok) {
                    console.error(result);
                    alert("Błąd wysyłania zdjęcia.");
                    loader.style.display = "none";
                    return;
                }

                await loadGallery();

                input.value = "";
                loader.style.display = "none";

            } catch (err) {

                loader.style.display = "none";
                console.error(err);
                alert("Błąd:\n" + err.message);

            }
        };

        img.src = e.target.result;
    };

    reader.readAsDataURL(file);
}

loadGallery();

document.querySelector(".close")
    .onclick = () => {

    document.getElementById(
        "lightbox"
    ).style.display = "none";
};

const lightbox =
    document.getElementById("lightbox");

const lightboxImg =
    document.getElementById("lightboxImg");

const closeBtn =
    document.querySelector(".close");

closeBtn.onclick = () => {
    lightbox.style.display = "none";
};

lightbox.onclick = (e) => {

    if (e.target === lightbox) {
        lightbox.style.display = "none";
    }
};

function showImage(index) {

    if (index < 0) {
        index = galleryFiles.length - 1;
    }

    if (index >= galleryFiles.length) {
        index = 0;
    }

    currentIndex = index;

    document.getElementById(
        "lightboxImg"
    ).src = galleryFiles[index].download_url;
}

document.querySelector(".prev").onclick = (e) => {
    e.stopPropagation();
    showImage(currentIndex - 1);
};

document.querySelector(".next").onclick = (e) => {
    e.stopPropagation();
    showImage(currentIndex + 1);
};

</script>
</body>
</html>
