<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria GitHub</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #f4f4f4;
        }

        h1 {
            text-align: center;
        }

        .upload-panel {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
        }

        button {
            padding: 10px 20px;
            background: #0366d6;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #024ea4;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill,minmax(250px,1fr));
            gap: 15px;
        }

        .gallery img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 10px;
            background: white;
            box-shadow: 0 2px 10px rgba(0,0,0,.1);
            transition: transform .3s;
        }

        .gallery img:hover {
            transform: scale(1.03);
        }
    </style>
</head>
<body>

<h1>Galeria zdjęć GitHub</h1>

<div class="upload-panel">

    <!-- Aparat telefonu -->
    <input
        type="file"
        id="imageInput"
        accept="image/*"
        capture="environment">

    <button onclick="uploadImage()">
        Wyślij zdjęcie
    </button>

</div>

<div id="gallery" class="gallery"></div>

<script>

    // KONFIGURACJA
    const owner = "tomekkotlewski";
    const repo = "weronika-lukasz";
    const branch = "main";
    const folder = "galeria";

    // TYLKO TESTOWO
    const githubToken = "tomek-token";

    async function loadGallery() {

        const url =
            `https://api.github.com/repos/${owner}/${repo}/contents/${folder}`;

        try {

            const response = await fetch(url);
            const files = await response.json();

            const gallery = document.getElementById("gallery");
            gallery.innerHTML = "";

            files
                .filter(file => file.type === "file")
                .forEach(file => {

                    const img = document.createElement("img");
                    img.src = file.download_url;

                    gallery.appendChild(img);
                });

        } catch (err) {
            console.error(err);
        }
    }

    async function uploadImage() {

        const input = document.getElementById("imageInput");

        if (!input.files.length) {
            alert("Wybierz zdjęcie.");
            return;
        }

        const file = input.files[0];

        const reader = new FileReader();

        reader.onload = async function() {

            const base64 =
                reader.result.split(",")[1];

            const fileName =
                `${Date.now()}_${file.name}`;

            const url =
                `https://api.github.com/repos/${owner}/${repo}/contents/${folder}/${fileName}`;

            const response = await fetch(url, {
                method: "PUT",
                headers: {
                    "Authorization": `Bearer ${githubToken}`,
                    "Accept": "application/vnd.github+json"
                },
                body: JSON.stringify({
                    message: `Dodano ${fileName}`,
                    content: base64,
                    branch: branch
                })
            });

        if(response.ok){
		alert("Zdjęcie zapisane.");
	} else {
	    const error = await response.json();

	    console.log(error);

	    alert(
	        "Status: " + response.status +
	        "\n\n" +
	        JSON.stringify(error, null, 2)
		);
	}

        };

        reader.readAsDataURL(file);
    }

    loadGallery();

</script>

</body>
</html>
